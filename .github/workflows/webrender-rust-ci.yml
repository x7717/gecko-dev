name: WebRender Rust CI

# Checks that the standalone WebRender Rust workspace (gfx/wr) still builds
# and its webrender crate unit tests pass. Runs on demand and weekly.
on:
  workflow_dispatch:
  schedule:
    # Every Monday at 05:00 UTC
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  webrender-cargo:
    name: cargo check + test (gfx/wr)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (depth 1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify gfx/wr workspace exists
        run: |
          test -f gfx/wr/Cargo.toml || { echo "gfx/wr workspace not found"; ls gfx | head; exit 1; }

      - name: Install system deps (freetype/pkg-config for servo-fontconfig-sys)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfreetype-dev libfontconfig1-dev libwayland-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gfx/wr

      # Core WebRender crates (the Firefox rendering engine components).
      # Example-compositor crates are excluded on purpose: they pull in
      # windowing-system deps (wayland/X11/GL headers) irrelevant to the
      # rendering core itself.
      - name: cargo check (core crates)
        working-directory: gfx/wr
        continue-on-error: false
        run: |
          test -f Cargo.toml || { echo "gfx/wr workspace not found"; ls ../ | head; exit 1; }
          cargo check -p webrender -p webrender_api -p wr_glyph_rasterizer -p wrench

      - name: cargo test -p webrender --lib
        working-directory: gfx/wr
        continue-on-error: false
        run: |
          test -f Cargo.toml || { echo "gfx/wr workspace not found"; ls ../ | head; exit 1; }
          cargo test -p webrender --lib
